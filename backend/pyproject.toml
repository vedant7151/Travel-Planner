[project]
name = "travel-planner-backend"
version = "1.0.0"
description = "Multi-agent travel planner API (Groq + Supabase Postgres + free public APIs)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "langgraph>=0.2.0",
  "langgraph-checkpoint-postgres>=2.0.0",
  "langchain>=0.3.0",
  "langchain-core>=0.3.0",
  "langchain-groq>=0.2.0",
  "langchain-google-genai>=2.0.0",
  "langsmith>=0.1.0",
  "asyncpg>=0.30.0",
  "psycopg[binary]>=3.2.0",
  "psycopg-pool>=3.2.0",
  "httpx>=0.27.0",
  "ddgs>=9.0.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.0.0",
  "PyJWT[crypto]>=2.9.0",
  "upstash-redis>=1.0.0",
  "redis>=5.0.0",
  "slowapi>=0.1.9",
  "tenacity>=9.0.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "respx>=0.21.0",
  "pgserver>=0.1.0",
]
lint = [
  "ruff>=0.17.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Conservative baseline for first-time CI adoption on an existing codebase:
# pycodestyle errors, pyflakes, and import sorting. E731 (no-lambda-assignment)
# is ignored rather than rewritten into app/core/llm.py's working retry logic,
# which is out of scope for introducing CI.
select = ["E", "F", "I"]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
# These PROMPT strings have one intentionally long example line each; a #
# noqa comment can't be used since it would become part of the string
# literal, and wrapping it would insert a literal newline into the prompt
# sent to the LLM -- a behavior change out of scope for adding CI.
"app/agents/accommodation.py" = ["E501"]
"app/agents/transport.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "allow_network: disable the autouse socket guard (only for tests that intentionally need it)",
]
